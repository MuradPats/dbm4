[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rico"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "boto3>=1.35",
    "requests>=2.32",
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.2",
    "open-clip-torch>=2.30",
    "sentence-transformers>=3.0",
    "datasets<3",
    "huggingface_hub<0.24",
    "fsspec<2024.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rico*"]
